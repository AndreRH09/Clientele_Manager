<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <a class="navbar-brand text-white">Employee Manager</a>

  <button
    class="navbar-toggler"
    type="button"
    data-toggle="collapse"
    data-target="#navbarColor02"
    aria-controls="navbarColor02"
    aria-expanded="false"
    aria-label="Toggle navigation">

    <span class="navbar-toggler-icon"></span>
  </button>

  <div class="navbar-collapse" id="navbarColor02">

    <ul class="navbar-nav mr-auto">
      <li class="nav-item active">
        <a
          class="nav-link"
          data-toggle="modal"
          data-target="#addEmployeeModal">
          Add Employee
        </a>
      </li>
    </ul>

    <form class="form-inline my-2 my-lg-0 ml-auto">
      <input
        type="search"
        name="key"
        id="searchName"
        class="form-control mr-sm-2"
        placeholder="Search employees...">
    </form>

  </div>
</nav>

<div class="container mt-4">

  <div class="row">
    <!--Car Inicio-->
    <div *ngFor="let employee of employees" class="col-md-6 col-xl-3">
      <div class="card m-b-30">

        <div class="card-body row">

          <div class="col-6">
            <a href="#">
              <img
                src="{{ employee?.imgUrl }}"
                alt="{{ employee?.name }}"
                class="img-fluid rounded-circle w-60">
            </a>
          </div>

          <div class="col-6 card-title align-self-center mb-0">
            <h5>{{ employee?.name }}</h5>
            <p class="m-0">{{ employee?.jobTitle }}</p>
          </div>

        </div>

        <ul class="list-group list-group-flush">
          <li class="list-group-item">
            <i class="fa fa-envelope float-right"></i>
            Email :
            <a href="mailto:{{ employee?.email }}">
              {{ employee?.email }}
            </a>
          </li>

          <li class="list-group-item">
            <i class="fa fa-phone float-right"></i>
            Phone : {{ employee?.phone }}
          </li>
        </ul>

      </div>
    </div>

  </div>

</div>

<div
  *ngIf="employees?.length == 0"
  class="col-lg-12 col-md-12 col-xl-12">

  <div class="alert alert-info" role="alert">
    <h4 class="alert-heading">NO EMPLOYEES!</h4>
    <p>No Employees were found.</p>
  </div>

</div>
